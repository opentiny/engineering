name: npm package bootstrap

on:
  workflow_dispatch:
    inputs:
      package:
        description: New @opentiny/* package name
        required: true
        type: string
      repository:
        description: Owning repository (opentiny/<repo>)
        required: true
        type: string
      workflow:
        description: Trusted Publisher workflow filename
        required: false
        default: npm-publish.yml
        type: string
      publish:
        description: Publish to npm (requires NPM_BOOTSTRAP_TOKEN in the npm-bootstrap environment)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bootstrap:
    name: Prepare placeholder package and instructions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INPUT_PACKAGE: ${{ inputs.package }}
      INPUT_REPOSITORY: ${{ inputs.repository }}
      INPUT_WORKFLOW: ${{ inputs.workflow }}
    steps:
      - name: Check out engineering tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate and create isolated placeholder
        id: prepare
        env:
          BOOTSTRAP_RESULT: ${{ runner.temp }}/npm-bootstrap-result.json
        run: |
          node scripts/npm/bootstrap-package.mjs \
            --package "$INPUT_PACKAGE" \
            --repository "$INPUT_REPOSITORY" \
            --workflow "$INPUT_WORKFLOW" \
            --temporary-root "$RUNNER_TEMP" > "$BOOTSTRAP_RESULT"
          node --input-type=module - "$BOOTSTRAP_RESULT" "$GITHUB_OUTPUT" <<'NODE'
          import fs from 'node:fs'
          const result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          fs.appendFileSync(process.argv[3], `directory=${result.directory}\nresult=${process.argv[2]}\n`)
          NODE

      - name: Pack placeholder and write instructions
        env:
          BOOTSTRAP_RESULT: ${{ steps.prepare.outputs.result }}
          BOOTSTRAP_ARTIFACT: ${{ runner.temp }}/npm-bootstrap-artifact
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: node scripts/npm/pack-bootstrap.mjs

      - name: Upload publishable package and instructions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-bootstrap-package
          path: ${{ runner.temp }}/npm-bootstrap-artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary placeholder
        if: ${{ always() }}
        env:
          BOOTSTRAP_RESULT: ${{ runner.temp }}/npm-bootstrap-result.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          if (!fs.existsSync(process.env.BOOTSTRAP_RESULT)) process.exit(0)
          const result = JSON.parse(fs.readFileSync(process.env.BOOTSTRAP_RESULT, 'utf8'))
          const directory = path.resolve(result.directory)
          const expectedParent = path.resolve(process.env.RUNNER_TEMP)
          if (path.dirname(directory) !== expectedParent || !path.basename(directory).startsWith('opentiny-npm-bootstrap-')) {
            throw new Error('Refusing to clean an unexpected path')
          }
          fs.rmSync(directory, { recursive: true, force: true })
          NODE

  publish:
    name: Publish prepared placeholder to npm
    if: ${{ inputs.publish == true }}
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-bootstrap
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download prepared package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-bootstrap-package
          path: ${{ runner.temp }}/npm-bootstrap-artifact

      - name: Publish @opentiny placeholder
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::Set NPM_BOOTSTRAP_TOKEN in the npm-bootstrap environment, or rerun with publish unchecked to publish locally.'
            exit 1
          fi
          npm publish "$RUNNER_TEMP/npm-bootstrap-artifact/placeholder.tgz" --access public --registry https://registry.npmjs.org

      - name: Report successful publication
        run: |
          printf '%s\n' '## npm bootstrap published' '' 'The prepared 0.0.0 placeholder was published to npm. Apply Trusted Publisher configuration using the instructions in the preparation summary or artifact README.md.' >> "$GITHUB_STEP_SUMMARY"
